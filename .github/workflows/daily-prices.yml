name: Daily prices

on:
  schedule:
    - cron: "0 5 * * 1-5"    # 9 AM UTC+4
    - cron: "0 17 * * 1-5"   # 9 PM UTC+4
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python prices.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
